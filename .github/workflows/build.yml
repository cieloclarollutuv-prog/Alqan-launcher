name: Build Alqan Launcher

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: alqan-launcher-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Huellas SHA-256
        run: cd artifacts && sha256sum *.exe *.dmg *.AppImage 2>/dev/null > SHA256SUMS.txt || true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Versión
        id: v
        run: echo "tag=v$(node -p "require('./src/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Alqan Launcher ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: artifacts/*
          body: |
            ## Descargar
            - **Windows**: `Alqan-Launcher-Setup.exe` (instalador) o `Alqan-Launcher-Portable.exe`
            - **macOS**: `Alqan-Launcher-mac-*.dmg`
            - **Linux**: `Alqan-Launcher-linux-*.AppImage`
            Verifica con `SHA256SUMS.txt`. El instalador no está firmado: Windows/Chrome pueden avisar; pulsa "Más información > Ejecutar de todas formas".
